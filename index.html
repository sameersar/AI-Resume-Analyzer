<!DOCTYPE html>
<html>
<head>
    <title>AI Resume Analyzer</title>
    <style>
        body {
            font-family: Arial;
            background: #f4f6f8;
            text-align: center;
        }
        .container {
            width: 400px;
            margin: 50px auto;
            padding: 20px;
            background: white;
            border-radius: 10px;
            box-shadow: 0px 0px 10px gray;
        }
        textarea, input {
            width: 90%;
            padding: 10px;
            margin: 10px 0;
        }
        button {
            padding: 10px 20px;
            background: blue;
            color: white;
            border: none;
            cursor: pointer;
        }
        .result {
            margin-top: 15px;
            font-weight: bold;
        }
        .good { color: green; }
        .bad { color: red; }
    </style>
</head>

<body>

<div class="container">
    <h2>AI Resume Analyzer</h2>

    <textarea id="resume" placeholder="Paste Resume Text Here" rows="6"></textarea>

    <input type="text" id="skills" placeholder="Enter Required Skills (comma separated)">

    <button onclick="analyze()">Analyze Resume</button>

    <div id="result" class="result"></div>
</div>

<script>
function analyze() {
    let resume = document.getElementById("resume").value.toLowerCase();
    let skills = document.getElementById("skills").value.toLowerCase().split(",");

    let match = 0;

    skills.forEach(skill => {
        if (resume.includes(skill.trim())) {
            match++;
        }
    });

    let score = (match / skills.length) * 100;

    let resultText = "Match Score: " + score.toFixed(2) + "%<br>";

    if (score >= 60) {
        resultText += "<span class='good'>Suitable Candidate</span>";
    } else {
        resultText += "<span class='bad'>Not Suitable</span>";
    }

    document.getElementById("result").innerHTML = resultText;
}
</script>

</body>
</html>
